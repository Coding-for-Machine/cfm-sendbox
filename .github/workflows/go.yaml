name: Go
on:
    push:
        paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum']
    pull_request:
        paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum']

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26'
            - run: go mod tidy
            - run: make lint
            - run: make test
            - run: make build
