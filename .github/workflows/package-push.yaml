name: 'Package Pushed'

on:
    push:
        branches:
            - main
            - master
            - v3
        paths:
            - packages/**
    workflow_dispatch:
        inputs:
            packages:
                description: 'Packages to build, e.g. "python-3.15.2 lua-5.5.1"'
                required: true

permissions:
    contents: write
    packages: write

jobs:
    build-pkg:
        name: Build package
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Login to GitHub registry
              uses: docker/login-action@v2
              with:
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
                  registry: ghcr.io

            - name: Get list of changed files
              if: github.event_name == 'push'
              uses: lots0logs/gh-action-get-changed-files@2.1.4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build Packages
              env:
                  INPUT_PACKAGES: ${{ github.event.inputs.packages }}
              run: |
                  if [ -n "$INPUT_PACKAGES" ]; then
                      PACKAGES="$INPUT_PACKAGES"
                  else
                      PACKAGES=$(jq '.[]' -r ${HOME}/files*.json | awk -F/ '$1~/packages/ && $2 && $3{ print $2 "-" $3 }' | sort -u)
                  fi
                  echo "Packages: $PACKAGES"
                  COUNT=$(echo $PACKAGES | wc -w)
                  if [ "$COUNT" -eq 0 ]; then echo "Nothing to build"; exit 0; fi
                  if [ "$COUNT" -gt 15 ]; then
                      echo "::error::$COUNT packages changed at once - run this workflow manually (Actions -> Package Pushed -> Run workflow) with a smaller list"
                      exit 1
                  fi
                  docker build -f repo/Dockerfile -t repo-builder .
                  docker run -v "${{ github.workspace }}:/cfm" repo-builder --no-server $PACKAGES
                  ls -la packages

            - name: Upload Packages
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  file: packages/*.pkg.tar.gz
                  tag: pkgs
                  overwrite: true
                  file_glob: true
    create-index:
        name: Create Index
        runs-on: ubuntu-latest
        needs: build-pkg
        steps:
            - name: 'Download all release assets'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # The pkgs release is addressed by its tag (not "latest"); gh pages through all assets.
                  gh release download pkgs --repo "${{ github.repository }}" --pattern '*.pkg.tar.gz'
                  ls -la
            - name: 'Generate index file'
              run: |
                  : > index
                  BASEURL=https://github.com/${{ github.repository }}/releases/download/pkgs/
                  for pkg in *.pkg.tar.gz
                  do
                    [ -e "$pkg" ] || continue
                    PKGFILE=$(basename $pkg)
                    PKGFILENAME=$(echo $PKGFILE | sed 's/\.pkg\.tar\.gz//g')

                    PKGNAME=$(echo $PKGFILENAME | grep -oP '^\K.+(?=-)')
                    PKGVERSION=$(echo $PKGFILENAME | grep -oP '^.+-\K.+')
                    PKGCHECKSUM=$(sha256sum $PKGFILE | awk '{print $1}')
                    echo "$PKGNAME,$PKGVERSION,$PKGCHECKSUM,$BASEURL$PKGFILE" >> index
                    echo "Adding package $PKGNAME-$PKGVERSION"
                  done
                  cat index
            - name: Upload index
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  file: index
                  tag: pkgs
                  overwrite: true
                  file_glob: true
